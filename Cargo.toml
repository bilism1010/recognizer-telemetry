[package]
name = "recognizer-telemetry"
version = "0.1.0"
edition = "2021"
description = "Real-time system telemetry streamer parsing 100k events/sec with WebGL visualization"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
